version: 1
name: etl-sales-pipeline
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install "flake8==7.1.1" "black==26.1.0" "isort==5.13.2"
      - name: Run flake8
        run: flake8 etl/ --max-line-length=120 --extend-ignore=E203 --exclude=__pycache__
      - name: Check black formatting
        run: black --diff --color etl/
      - name: Check import ordering
        run: isort --check-only etl/

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Run unit tests
        run: pytest tests/ -v --cov=etl --cov-report=term-missing

  - id: provision_ecr
    kind: provision
    needs: [test]
    timeout_minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform Apply ECR only
        working-directory: infra
        run: |
          terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.etl

  - id: build_push
    kind: build_push
    needs: [provision_ecr]
    timeout_minutes: 20
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          PROJECT: ${{ secrets.PROJECT_NAME }}
        run: |
          docker build -t $ECR_REGISTRY/$PROJECT-etl:$IMAGE_TAG -t $ECR_REGISTRY/$PROJECT-etl:latest .
          docker push $ECR_REGISTRY/$PROJECT-etl:$IMAGE_TAG
          docker push $ECR_REGISTRY/$PROJECT-etl:latest

  - id: provision
    kind: provision
    needs: [build_push]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform Validate
        working-directory: infra
        run: terraform validate
      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -input=false tfplan

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init (read outputs)
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Upload sample CSV to S3
        working-directory: infra
        run: |
          BUCKET=$(terraform output -raw s3_bucket_name)
          aws s3 cp ../data/sample_sales.csv s3://$BUCKET/input/sample_sales.csv
          echo "Uploaded sample_sales.csv to s3://$BUCKET/input/"
      - name: Register fresh ECS task definition with current image tag
        id: register_task
        working-directory: infra
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)
          NEW_IMAGE="${ECR_URL}:${IMAGE_TAG}"
          FAMILY=$(terraform output -raw ecs_task_definition_arn | sed 's|.*/task-definition/||' | sed 's|:[0-9]*$||')
          echo "Registering new task definition revision for family: $FAMILY"
          echo "Image: $NEW_IMAGE"
          CURRENT_DEF=$(aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query 'taskDefinition' --output json)
          NEW_DEF=$(echo "$CURRENT_DEF" | python3 -c "
          import json, sys
          td = json.load(sys.stdin)
          for c in td.get('containerDefinitions', []):
              if c['name'] == 'etl':
                  c['image'] = '${NEW_IMAGE}'
          keep = ['family','taskRoleArn','executionRoleArn','networkMode',
                  'containerDefinitions','volumes','placementConstraints',
                  'requiresCompatibilities','cpu','memory','tags']
          out = {k: td[k] for k in keep if k in td}
          print(json.dumps(out))
          ")
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered new task definition: $NEW_ARN"
          echo "task_def_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
      - name: Run DB schema init via ECS Fargate task
        working-directory: infra
        env:
          FRESH_TASK_DEF: ${{ steps.register_task.outputs.task_def_arn }}
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SUBNET=$(terraform output -raw private_subnet_id)
          TASK_SG=$(terraform output -raw ecs_task_sg_id)
          echo "Launching schema-init task in VPC (cluster: $CLUSTER) ..."
          echo "Task definition: $FRESH_TASK_DEF"
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$FRESH_TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$TASK_SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"etl","command":["python","scripts/init_schema.py"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Schema-init task ARN: $TASK_ARN"
          echo "Waiting for task to complete (up to 10 min) ..."
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Schema-init exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Schema init failed. Check CloudWatch Logs for details."
            exit 1
          fi
          echo "Schema init completed successfully."
      - name: Confirm EventBridge schedule provisioned
        working-directory: infra
        run: |
          SCHEDULE_ARN=$(terraform output -raw eventbridge_schedule_arn)
          echo "EventBridge daily schedule active: $SCHEDULE_ARN"

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init (read outputs)
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Resolve latest ECS task definition for current image
        id: resolve_task
        working-directory: infra
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)
          NEW_IMAGE="${ECR_URL}:${IMAGE_TAG}"
          FAMILY=$(terraform output -raw ecs_task_definition_arn | sed 's|.*/task-definition/||' | sed 's|:[0-9]*$||')
          LATEST_ARN=$(aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          CURRENT_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          echo "Current task image: $CURRENT_IMAGE"
          echo "Expected image:     $NEW_IMAGE"
          if [ "$CURRENT_IMAGE" = "$NEW_IMAGE" ]; then
            echo "Task definition already uses current image. Using: $LATEST_ARN"
            echo "task_def_arn=$LATEST_ARN" >> "$GITHUB_OUTPUT"
          else
            echo "Registering fresh task definition with current image ..."
            CURRENT_DEF=$(aws ecs describe-task-definition \
              --task-definition "$FAMILY" \
              --query 'taskDefinition' --output json)
            NEW_DEF=$(echo "$CURRENT_DEF" | python3 -c "
          import json, sys
          td = json.load(sys.stdin)
          for c in td.get('containerDefinitions', []):
              if c['name'] == 'etl':
                  c['image'] = '${NEW_IMAGE}'
          keep = ['family','taskRoleArn','executionRoleArn','networkMode',
                  'containerDefinitions','volumes','placementConstraints',
                  'requiresCompatibilities','cpu','memory','tags']
          out = {k: td[k] for k in keep if k in td}
          print(json.dumps(out))
            ")
            NEW_ARN=$(aws ecs register-task-definition \
              --cli-input-json "$NEW_DEF" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "Registered: $NEW_ARN"
            echo "task_def_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify ECS task definition is ACTIVE
        working-directory: infra
        env:
          TASK_DEF_ARN: ${{ steps.resolve_task.outputs.task_def_arn }}
        run: |
          STATUS=$(aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition.status' --output text)
          echo "Task definition status: $STATUS"
          [ "$STATUS" = "ACTIVE" ] && echo "ECS task definition verified ACTIVE" || (echo "Unexpected status: $STATUS" && exit 1)
      - name: Verify S3 landing bucket and sample CSV
        working-directory: infra
        run: |
          BUCKET=$(terraform output -raw s3_bucket_name)
          aws s3 ls s3://$BUCKET/input/ | grep sample_sales.csv
          echo "S3 landing bucket and sample CSV verified"
      - name: Verify CloudWatch log group exists
        working-directory: infra
        run: |
          LOG_GROUP=$(terraform output -raw cloudwatch_log_group)
          aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" \
            --query 'logGroups[0].logGroupName' --output text | grep -q "$LOG_GROUP"
          echo "CloudWatch log group verified: $LOG_GROUP"
      - name: Run trial ETL via ECS Fargate and verify success
        working-directory: infra
        env:
          TASK_DEF_ARN: ${{ steps.resolve_task.outputs.task_def_arn }}
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SUBNET=$(terraform output -raw private_subnet_id)
          TASK_SG=$(terraform output -raw ecs_task_sg_id)
          echo "Launching trial ETL run ..."
          echo "Task definition: $TASK_DEF_ARN"
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$TASK_SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Trial ETL task ARN: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Trial ETL exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Trial ETL failed. Check CloudWatch Logs: $(terraform output -raw cloudwatch_log_group)"
            exit 1
          fi
          echo "Trial ETL run completed successfully. Pipeline is live."

rollback:
  strategy: manual

destroy:
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_DEFAULT_REGION: us-east-1
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    TF_VAR_image_tag: placeholder
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform Init
      working-directory: infra
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=us-east-1"
    - name: Terraform Destroy
      working-directory: infra
      run: terraform destroy -input=false -auto-approve
