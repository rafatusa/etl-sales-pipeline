        TASK_SG=$(terraform output -raw ecs_task_sg_id)\nTASK_ARN=$(aws ecs run-task\
        \ \\\n  --cluster \"$CLUSTER\" \\\n  --task-definition \"$TASK_DEF\" \\\n\
        \  --launch-type FARGATE \\\n  --network-configuration \"awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$TASK_SG],assignPublicIp=DISABLED}\"\
        \ \\\n  --query 'tasks[0].taskArn' --output text)\necho \"Triggered ETL task:\
        \ $TASK_ARN\"\naws ecs wait tasks-stopped --cluster \"$CLUSTER\" --tasks \"\
