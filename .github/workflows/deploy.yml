        \ --output text)\nSTOP_CODE=$(aws ecs describe-tasks \\\n  --cluster \"$CLUSTER\"\
        \ --tasks \"$TASK_ARN\" \\\n  --query 'tasks[0].stopCode' --output text)\n\
        echo \"Schema-init stop code: $STOP_CODE\"\necho \"Schema-init exit code:\
        \ $EXIT_CODE\"\n\nif [ \"$EXIT_CODE\" != \"0\" ]; then\n  TASK_SHORT=$(echo\
        \ \"$TASK_ARN\" | awk -F/ '{print $NF}')\n  echo \"Schema init failed. Fetching\
        \ CloudWatch logs ...\"\n  aws logs get-log-events \\\n    --log-group-name\
        \ \"$LOG_GROUP\" \\\n    --log-stream-name \"etl/etl/$TASK_SHORT\" \\\n  \
        \  --limit 30 --query 'events[*].message' --output text 2>/dev/null || true\n\
        \  exit 1\nfi\necho \"Schema init completed successfully.\"\n"
      working-directory: infra
    - name: Confirm EventBridge schedule provisioned
      run: 'SCHEDULE_ARN=$(terraform output -raw eventbridge_schedule_arn)

