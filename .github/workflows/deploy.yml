jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install linters
      run: pip install "flake8==7.1.1" "black==26.1.0" "isort==5.13.2"
    - name: Run flake8
      run: flake8 etl/ --max-line-length=120 --extend-ignore=E203 --exclude=__pycache__
    - name: Check black formatting
      run: black --diff --color etl/
    - name: Check import ordering
      run: isort --check-only etl/
  test:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt pytest pytest-cov
    - name: Run unit tests
      run: pytest tests/ -v --cov=etl --cov-report=term-missing
  build_push:
    runs-on: ubuntu-latest
    needs:
    - test
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
