        \ \"$TASK_ARN\" \\\n  --query 'tasks[0].containers[0].exitCode' --output text)\n\
        if [ \"$EXIT_CODE\" != \"0\" ]; then\n  echo \"ETL task failed with exit code\
        \ $EXIT_CODE\"\n  exit 1\nfi\necho \"ETL verify run completed successfully\"\
        \n"
      working-directory: infra
