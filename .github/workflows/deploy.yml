        \ | python3 -c \"\nimport json, sys, os\ntd = json.load(sys.stdin)\nnew_image\
        \ = os.environ['NEW_IMAGE']\nfor c in td.get('containerDefinitions', []):\n\
        \    if c['name'] == 'etl':\n        c['image'] = new_image\nkeep = ['family','taskRoleArn','executionRoleArn','networkMode',\n\
