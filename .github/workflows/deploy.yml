        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    - name: Verify CloudWatch log group exists
      run: "LOG_GROUP=$(terraform output -raw cloudwatch_log_group)\naws logs describe-log-groups\
        \ --log-group-name-prefix \"$LOG_GROUP\" \\\n  --query 'logGroups[0].logGroups[0].logGroupName'\
        \ --output text | grep -q \"$LOG_GROUP\"\necho \"CloudWatch log group verified\"\
        \n"
      working-directory: infra
    - name: Trigger manual ETL run and verify completion
