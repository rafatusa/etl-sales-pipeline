jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install linters
      run: pip install "flake8==7.1.1" "black==26.1.0" "isort==5.13.2"
    - name: Run flake8
      run: flake8 etl/ --max-line-length=120 --extend-ignore=E203 --exclude=__pycache__
    - name: Check black formatting
      run: black --diff --color etl/
    - name: Check import ordering
      run: isort --check-only etl/
  test:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt pytest pytest-cov
    - name: Run unit tests
      run: pytest tests/ -v --cov=etl --cov-report=term-missing
  provision_ecr:
    runs-on: ubuntu-latest
    needs:
    - test
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_image_tag: ${{ github.sha }}
