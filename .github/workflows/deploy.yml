name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install linters
      run: pip install "flake8==7.1.1" "black==26.1.0" "isort==5.13.2"
    - name: Run flake8
      run: flake8 etl/ --max-line-length=120 --extend-ignore=E203 --exclude=__pycache__
    - name: Check black formatting
      run: black --diff --color etl/
    - name: Check import ordering
      run: isort --check-only etl/
  test:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt pytest pytest-cov
    - name: Run unit tests
      run: pytest tests/ -v --cov=etl --cov-report=term-missing
  provision_ecr:
    runs-on: ubuntu-latest
    needs:
    - test
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_image_tag: latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform Init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform Apply ECR only
      run: "terraform apply -input=false -auto-approve \\\n  -target=aws_ecr_repository.etl\n"
      working-directory: infra
  build_push:
    runs-on: ubuntu-latest
    needs:
    - provision_ecr
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - id: ecr_login
      name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build and push Docker image
      run: 'docker build -t $ECR_REGISTRY/$PROJECT-etl:$IMAGE_TAG -t $ECR_REGISTRY/$PROJECT-etl:latest
        .

        docker push $ECR_REGISTRY/$PROJECT-etl:$IMAGE_TAG

        docker push $ECR_REGISTRY/$PROJECT-etl:latest

        '
      env:
        ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        PROJECT: ${{ secrets.PROJECT_NAME }}
  provision:
    runs-on: ubuntu-latest
    needs:
    - build_push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
