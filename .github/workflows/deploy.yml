        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform Apply ECR only
      run: "terraform apply -input=false -auto-approve \\\n  -target=aws_ecr_repository.etl\n"
      working-directory: infra
  build_push:
    runs-on: ubuntu-latest
    needs:
    - provision_ecr
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
