        ]}]}'\necho \"Launching schema-init in VPC (cluster: $CLUSTER) ...\"\nTASK_ARN=$(aws\
        \ ecs run-task \\\n  --cluster \"$CLUSTER\" \\\n  --task-definition \"$FRESH_ARN\"\
        \ \\\n  --launch-type FARGATE \\\n  --network-configuration \"awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$TASK_SG],assignPublicIp=DISABLED}\"\
        \ \\\n  --overrides \"$OVERRIDES\" \\\n  --query 'tasks[0].taskArn' --output\
        \ text)\necho \"Schema-init task ARN: $TASK_ARN\"\necho \"Waiting for schema-init\
        \ to complete ...\"\naws ecs wait tasks-stopped --cluster \"$CLUSTER\" --tasks\
        \ \"$TASK_ARN\"\nEXIT_CODE=$(aws ecs describe-tasks \\\n  --cluster \"$CLUSTER\"\
        \ --tasks \"$TASK_ARN\" \\\n  --query 'tasks[0].containers[0].exitCode' --output\
