        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Verify ECS task definition registered
      run: "TASK_DEF=$(terraform output -raw ecs_task_definition_arn)\naws ecs describe-task-definition\
        \ --task-definition \"$TASK_DEF\" \\\n  --query 'taskDefinition.status' --output\
        \ text | grep -q ACTIVE\necho \"ECS task definition is ACTIVE\"\n"
      working-directory: infra
    - name: Verify S3 bucket accessible
      run: 'BUCKET=$(terraform output -raw s3_bucket_name)

        aws s3 ls s3://$BUCKET/input/ | grep sample_sales.csv

        echo "S3 landing bucket verified"

        '
      working-directory: infra
    - name: Verify RDS reachable via Secrets Manager
      run: "RDS_ENDPOINT=$(terraform output -raw rds_endpoint)\npip install psycopg2-binary\n\
