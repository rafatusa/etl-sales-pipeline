        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Run DB schema migration
      run: "RDS_ENDPOINT=$(terraform output -raw rds_endpoint)\npip install psycopg2-binary\
        \ sqlalchemy\npython ../scripts/init_schema.py \\\n  --host \"$RDS_ENDPOINT\"\
        \ \\\n  --db salesdb \\\n  --user etladmin \\\n  --password \"$DB_PASSWORD\"\
        \n"
      working-directory: infra
