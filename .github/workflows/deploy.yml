        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - id: ecr_login
      name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build and push Docker image
      run: 'docker build -t $ECR_REGISTRY/$PROJECT-etl:$IMAGE_TAG -t $ECR_REGISTRY/$PROJECT-etl:latest
        .

        docker push $ECR_REGISTRY/$PROJECT-etl:$IMAGE_TAG

        docker push $ECR_REGISTRY/$PROJECT-etl:latest

        '
      env:
        ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        PROJECT: ${{ secrets.PROJECT_NAME }}
  provision:
    runs-on: ubuntu-latest
    needs:
    - build_push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
