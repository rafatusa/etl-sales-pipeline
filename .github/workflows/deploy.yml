        \ --task-definition \"$TASK_DEF\" \\\n  --launch-type FARGATE \\\n  --network-configuration\
        \ \"awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$TASK_SG],assignPublicIp=DISABLED}\"\
        \ \\\n  --overrides '{\"containerOverrides\":[{\"name\":\"etl\",\"command\"\
        :[\"python\",\"scripts/init_schema.py\"]}]}' \\\n  --query 'tasks[0].taskArn'\
