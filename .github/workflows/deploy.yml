        \ 'taskDefinition.status' --output text)\necho \"Task definition status: $STATUS\"\
        \n[ \"$STATUS\" = \"ACTIVE\" ] && echo \"ECS task definition verified ACTIVE\"\
        \ || (echo \"Unexpected status: $STATUS\" && exit 1)\n"
      working-directory: infra
    - name: Verify S3 landing bucket and sample CSV
      run: 'BUCKET=$(terraform output -raw s3_bucket_name)

        aws s3 ls s3://$BUCKET/input/ | grep sample_sales.csv

        echo "S3 landing bucket and sample CSV verified"

        '
      working-directory: infra
    - name: Verify CloudWatch log group exists
      run: "LOG_GROUP=$(terraform output -raw cloudwatch_log_group)\naws logs describe-log-groups\
