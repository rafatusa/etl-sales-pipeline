        \ \"0\" ]; then\n  echo \"Trial ETL failed. Check CloudWatch Logs: $(terraform\
        \ output -raw cloudwatch_log_group)\"\n  exit 1\nfi\necho \"Trial ETL run\
        \ completed successfully. Pipeline is live.\"\n"
      working-directory: infra
      env:
        TASK_DEF_ARN: ${{ steps.resolve_task.outputs.task_def_arn }}
